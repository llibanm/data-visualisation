<!DOCTYPE html>
<head>

    <meta charset="utf-8">
    <title>D3 Scatterplot - Local Car Data</title>
    <script type="text/javascript" src="d3.v7.min.js"></script>
    <script src="data.js"></script>
</head>
<body>
    <div id="my_dataviz"></div>

    <script>
        const clean_data = data
        .filter(d => d["price"] !== "?" & d["engine-size"] !== "?")
        .map(
            d =>({
                ...d,
                engineSize: +d["engine-size"],
                price: +d["price"],
                horsepower: +d["horsepower"] !== "?" ? +d["horsepower"] : null
            })
        );


        //chart dimension
        const margin = {top: 20, right: 30, bottom: 40, left: 70},
          width = 600 - margin.left - margin.right,
          height = 400 - margin.top - margin.bottom;

        //appending the svg canvas
        const svg = d3.select("#my_dataviz")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left}, ${margin.top})`);

        //X axis: 
        const x = d3.scaleLinear()
        .domain([0, 350])
        .range([0, width]);

        svg.append("g")
        .attr("transform", `translate(0, ${height})`)
        .call(d3.axisBottom(x));



        //Y axis
        const y = d3.scaleLinear()
            .domain([0, 50000])
            .range([height, 0]);

            svg.append("g")
            .call(d3.axisLeft(y));

        // Scatterplot dots
        svg.append("g")
        .selectAll("circle")
        .data(clean_data)
        .join("circle")
            .attr("cx", d => x(d.engineSize))
            .attr("cy", d => y(d.price))
            .attr("r", 4)
            .style("fill", "#4682b4")
            .style("opacity", 0.7);

    </script>
</body>
