<!DOCTYPE html>
    <meta charset="utf-8">

    <!-- Load d3.js -->
    <script src="d3.v6.js"></script>

    <!-- Add a slider -->
    <input type="range" name="mySlider" id=mySlider min="10" max="100" value="50">

    <!-- Create a div where the graph will take place -->
    <div id="my_dataviz"></div>
    <script src="data.js"></script>

<script>
// set the dimensions and margins of the graph

    const clean_data = data
        .filter(d => d["price"] !== "?" & d["engine-size"] !== "?")
        .map(
            d =>({
                ...d,
                engineSize: +d["engine-size"],
                price: +d["price"],
                horsepower: +d["horsepower"] !== "?" ? +d["horsepower"] : null
            })
    );

    const xMax = d3.max(clean_data, d => d.price) || 1000;
    const xMin = d3.min(clean_data, d => d.price) || 1000;

const margin = {top: 30, right: 30, bottom: 30, left: 50},
    width = 460 - margin.left - margin.right,
    height = 400 - margin.top - margin.bottom;

// append the svg object to the body of the page
const svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

// get the data


  // add the x Axis
  const x = d3.scaleLinear()
            .domain([xMin , xMax])
            .range([0, width]);
  svg.append("g")
      .attr("transform", `translate(0, ${height})`)
      .call(d3.axisBottom(x));

  const bandwidth = 2500;
  let kde = kernelDensityEstimator(kernelEpanechnikov(bandwidth), x.ticks(50));
  let density = kde(clean_data.map(d => d.price));
  const yMax = d3.max(density, d => d[1]) * 1.1;

  // add the y Axis
  const y = d3.scaleLinear()
            .range([height, 0])
            .domain([0, yMax]);
  svg.append("g")
      .call(d3.axisLeft(y));

  // Compute kernel density estimation

 
  // Plot the area
  const curve = svg
    .append('g')
    .append("path")
      .attr("class", "mypath")
      .datum(density)
      .attr("fill", "none")
      .attr("opacity", ".8")
      .attr("stroke", "#000")
      .attr("stroke-width", 1)
      .attr("stroke-linejoin", "round")
      .attr("d",  d3.line()
        .curve(d3.curveBasis)
          .x(function(d) { return x(d[0]); })
          .y(function(d) { return y(d[1]); })
      );

  // A function that update the chart when slider is moved?
  function updateChart(binNumber) {
    // recompute density estimation
    kde = kernelDensityEstimator(kernelEpanechnikov(bandwidth), x.ticks(binNumber))
    density =  kde( clean_data.map(function(d){  return d.price; }) )


    // update the chart
    curve
      .datum(density)
      .transition()
      .duration(1000)
      .attr("d",  d3.line()
        .curve(d3.curveBasis)
          .x(function(d) { return x(d[0]); })
          .y(function(d) { return y(d[1]); })
      );
  }

  // Listen to the slider?
  d3.select("#mySlider").on("change", function(d){
    selectedValue = this.value
    updateChart(selectedValue)
  })




// Function to compute density
function kernelDensityEstimator(kernel, X) {
  return function(V) {
    return X.map(function(x) {
      return [x, d3.mean(V, function(v) { return kernel(x - v); })];
    });
  };
}
function kernelEpanechnikov(k) {
  return function(v) {
    return Math.abs(v /= k) <= 1 ? 0.75 * (1 - v * v) / k : 0;
  };
}
</script>
