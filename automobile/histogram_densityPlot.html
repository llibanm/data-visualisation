<!DOCTYPE html>
<meta charset="utf-8">

<!-- Load d3.js -->
<script src="d3.v6.js"></script>
<script src="data.js"></script>

<!-- Add a slider -->
<input type="range" name="mySlider" id=mySlider min="10" max="100" value="50">

<p>
  <label># bins</label>
  <input type="number" min="1" max="100" step="30" value="20" id="nBin">
</p>

<!-- Create a div where the graph will take place -->
<div id="my_dataviz"></div>

<script>
// set the dimensions and margins of the graph

    const clean_data = data
        .filter(d => d["price"] !== "?" & d["engine-size"] !== "?")
        .map(
            d =>({
                ...d,
                engineSize: +d["engine-size"],
                price: +d["price"],
                horsepower: +d["horsepower"] !== "?" ? +d["horsepower"] : null
            })
    );

    const xMax = d3.max(clean_data, d => d.price) || 1000;
    const xMin = d3.min(clean_data, d => d.price) || 1000;

const margin = {top: 30, right: 65, bottom: 30, left: 50},
    width = 520 - margin.left - margin.right,
    height = 400 - margin.top - margin.bottom;

// append the svg object to the body of the page
const svg = d3.select("#my_dataviz")
  .append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g")
    .attr("transform",
          `translate(${margin.left},${margin.top})`);

// get the data


  // X axis: scale and draw:
  const x = d3.scaleLinear()
      .domain([xMin, xMax])     // can use this instead of 1000 to have the max of data: d3.max(data, function(d) { return +d.price })
      .range([0, width]);
  svg.append("g")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x));

  // Y axis: initialization 
  const y = d3.scaleLinear()
      .range([height, 0]);
  const yAxis = svg.append("g")

  // Compute kernel density estimation
  const bandwidth = 2500;
  let kde = kernelDensityEstimator(kernelEpanechnikov(bandwidth), x.ticks(50));
  let density = kde(clean_data.map(d => d.price));
  const yMax = d3.max(density, d => d[1]) * 1.1;

  // add the y Axis 
  const yDensity = d3.scaleLinear()
            .range([height, 0])
            .domain([0, yMax]);
  svg.append("g")
      .attr("transform", `translate(${width}, 0)`)
      .call(d3.axisRight(yDensity));


  const histGroup = svg.append("g");
  const curveGroup = svg.append("g");

  function update(nBin) {

    // set the parameters for the histogram
    const histogram = d3.histogram()
        .value(function(d) { return d.price; })   
        .domain(x.domain())  
        .thresholds(x.ticks(nBin)); 

    // And apply this function to data to get the bins
    const bins = histogram(clean_data);

    // Y axis:
    y.domain([0, d3.max(bins, function(d) { return d.length; })]);   
    yAxis
        .transition()
        .duration(1000)
        .call(d3.axisLeft(y));

    // Join the rect with the bins data
    const u = histGroup.selectAll("rect")
        .data(bins)

    // Manage the existing bars and eventually the new ones:
    u
        .join("rect") // Add a new rect for each new elements
        .transition() // and apply changes to all of them
        .duration(1000)
          .attr("x", 1)
          .attr("transform", function(d) { return `translate(${x(d.x0)}, ${y(d.length)})`})
          .attr("width", function(d) { return Math.max(0, x(d.x1) - x(d.x0) - 1) ; })
          .attr("height", function(d) { return height - y(d.length); })
          .style("fill", "#69b3a2")
          .style("opacity", 0.7)

    }

  // Initialize with 20 bins
  update(20)

  // Listen to the button -> update if user change it
  d3.select("#nBin").on("input", function() {
    update(+this.value);
  });

  // Plot the area
  const curve = curveGroup
    .append("path")
      .attr("class", "mypath")
      .datum(density)
      .attr("fill", "none")
      .attr("opacity", ".8")
      .attr("stroke", "#000")
      .attr("stroke-width", 1)
      .attr("stroke-linejoin", "round")
      .attr("d",  d3.line()
        .curve(d3.curveBasis)
          .x(function(d) { return x(d[0]); })
          .y(function(d) { return yDensity(d[1]); })
      );

  // A function that update the chart when slider is moved?
  function updateChart(binNumber) {
    // recompute density estimation
    kde = kernelDensityEstimator(kernelEpanechnikov(bandwidth), x.ticks(binNumber))
    density =  kde( clean_data.map(function(d){  return d.price; }) )


    // update the chart
    curve
      .datum(density)
      .transition()
      .duration(1000)
      .attr("d",  d3.line()
        .curve(d3.curveBasis)
          .x(function(d) { return x(d[0]); })
          .y(function(d) { return yDensity(d[1]); })
      );
  }

  // Listen to the slider?
  d3.select("#mySlider").on("change", function(d){
    selectedValue = this.value
    updateChart(selectedValue)
  })

// Function to compute density
function kernelDensityEstimator(kernel, X) {
  return function(V) {
    return X.map(function(x) {
      return [x, d3.mean(V, function(v) { return kernel(x - v); })];
    });
  };
}
function kernelEpanechnikov(k) {
  return function(v) {
    return Math.abs(v /= k) <= 1 ? 0.75 * (1 - v * v) / k : 0;
  };
}
</script>
